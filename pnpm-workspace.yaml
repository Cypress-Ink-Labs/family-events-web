packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - '@vitest/*'
  - vitest
  - framer-motion@12.40.0
  - motion-dom@12.40.0
  - motion@12.40.0
  - vite@8.0.14
  - '@tanstack/react-virtual@3.13.26'
  - '@tanstack/virtual-core@3.16.0'
  - '@cypress-ink-labs/contracts'
  - '@cypress-ink-labs/design-system'
